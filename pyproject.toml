[project]
name = "college-library"
version = "0.1.0"
description = "Система учёта книг библиотеки колледжа"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
